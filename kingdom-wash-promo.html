<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kingdom Wash - 10% off your first service</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f3effa;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e0d4f5;
    border-radius: 16px;
    padding: 3rem 3.5rem;
    text-align: center;
    box-shadow: 0 4px 24px rgba(90, 40, 160, 0.08);
    max-width: 420px;
  }
  .brand {
    font-weight: 700;
    font-size: 1.15rem;
    color: #4b1f8f;
    margin: 0 0 1rem;
    letter-spacing: 0.02em;
  }
  .badge {
    display: inline-block;
    background: #ece1fb;
    color: #5a2ba0;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    margin-bottom: 1.25rem;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 2.1rem;
    margin: 0 0 0.75rem;
    color: #2e1450;
  }
  p.note {
    color: #6c5b8a;
    font-size: 0.95rem;
    margin: 0 0 2rem;
    font-style: italic;
  }
  button {
    background: #5a2ba0;
    color: #fff;
    border: none;
    padding: 0.85rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="brand">Kingdom Wash</p>
    <span class="badge">Limited time offer</span>
    <h1>10% off your first service</h1>
    <p class="note">Present at time of service</p>
    <button>Claim your discount</button>
  </div>
</body>
</html>
